# yaml-language-server: $schema=../schemas/site.schema.json
# Sitio de ejemplo: quotes.toscrape.com es un sandbox público pensado para practicar scraping.
# Demuestra listado + paginación + página de detalle (autor).
name: ejemplo-quotes
description: Citas y autores del sandbox quotes.toscrape.com (ejemplo de listado -> detalle)
base_url: https://quotes.toscrape.com

politeness:
  delay_seconds: 1
  max_concurrency: 2
  respect_robots: true

fetch:
  mode: http

start_urls:
  - /

pagination:
  next_selector: "li.next a::attr(href)"
  max_pages: 3

list:
  item_selector: "div.quote"
  detail_url: "span a::attr(href)"        # enlace "(about)" del autor
  fields:
    texto:  { selector: "span.text", type: str, required: true }
    autor:  { selector: "small.author", type: str, required: true }
    tags:   { selector: "div.tags a.tag", type: list }

detail:
  fields:
    autor_nacimiento: { selector: "span.author-born-date", type: date }
    autor_lugar:      { selector: "span.author-born-location", type: str, regex: "^in\\s+(.*)$" }

key: [texto, autor]

export:
  default: xlsx
