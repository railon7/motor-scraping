[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-scraping"
version = "0.3.0"
description = "Motor de web scraping genérico y clonable (Tazuke): YAML por sitio, SQLite, export CSV/XLSX/JSON"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "pydantic>=2.5",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "sqlalchemy>=2.0",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
scraper = "scraper.cli:app"

[tool.setuptools.packages.find]
include = ["scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
